<svg width="860" height="360" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Diagrama C4 de contenedores de TaskFlow</title>
  <desc>Persona usa la SPA en React, que llama a la API en Laravel via HTTPS/JSON, que consulta la base de datos MySQL via SQL.</desc>

  <rect width="860" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#445" />
    </marker>
  </defs>

  <!-- ===== Persona ===== -->
  <rect x="40" y="20" width="180" height="100" rx="10" fill="#073B6F" stroke="#052C53" stroke-width="1.5"/>
  <!-- icono persona -->
  <circle cx="130" cy="45" r="10" fill="#ffffff" opacity="0.92"/>
  <path d="M114,79 L122,58 Q130,52 138,58 L146,79 Z" fill="#ffffff" opacity="0.92"/>
  <text x="130" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Persona</text>
  <text x="130" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#D6E4F0">Usuario del sistema</text>

  <!-- flecha Persona -> SPA -->
  <line x1="130" y1="120" x2="130" y2="220" stroke="#445" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="174" font-family="Arial, sans-serif" font-size="12" fill="#333">usa</text>

  <!-- ===== SPA (React) ===== -->
  <rect x="40" y="220" width="180" height="100" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/>
  <text x="130" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">SPA</text>
  <text x="130" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#DCEBFA">[React]</text>
  <text x="130" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Interfaz web de usuario</text>

  <!-- flecha SPA -> API -->
  <line x1="220" y1="270" x2="340" y2="270" stroke="#445" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">HTTPS/JSON</text>

  <!-- ===== API (Laravel) ===== -->
  <rect x="340" y="220" width="180" height="100" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/>
  <text x="430" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">API</text>
  <text x="430" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#DCEBFA">[Laravel]</text>
  <text x="430" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Expone la API REST</text>

  <!-- flecha API -> Base de datos -->
  <line x1="520" y1="270" x2="640" y2="270" stroke="#445" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">SQL</text>

  <!-- ===== Base de datos (MySQL), forma de cilindro ===== -->
  <rect x="640" y="220" width="180" height="100" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/>
  <ellipse cx="730" cy="320" rx="90" ry="14" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/>
  <ellipse cx="730" cy="220" rx="90" ry="14" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/>
  <text x="730" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Base de datos</text>
  <text x="730" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#DCEBFA">[MySQL]</text>
  <text x="730" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Guarda tareas y usuarios</text>
</svg>
